name: standalone packages

on:
  workflow_dispatch:
    inputs:
      registry:
        description: Build only, or publish one registry after verification
        required: true
        default: verify
        type: choice
        options: [verify, npm, pypi, crates]

permissions:
  contents: read

concurrency:
  group: packages-${{ inputs.registry }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install verifier tools
        run: |
          python -m pip install 'uv>=0.13.9,<0.14' ruff==0.17.5 mypy==2.4.1 pytest==9.2.0 pyyaml==6.0.3
          npm install --global eslint@10.15.0 typescript@7.0.2
      - name: Verify source and installed packages
        run: |
          bash scripts/check.sh
          python scripts/check-packages.py
          cd dist
          sha256sum *.whl *.tar.gz *.tgz *.crate > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: beton-checks-packages
          path: dist/
          if-no-files-found: error

  npm:
    if: inputs.registry == 'npm' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: beton-checks-packages
          path: dist/
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org/
      - name: Publish tested npm tarball
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm install --global npm@11
          npm publish dist/*.tgz --access public

  pypi:
    if: inputs.registry == 'pypi' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: beton-checks-packages
          path: dist/
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Publish tested Python archives
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          python -m pip install 'uv>=0.13.9,<0.14'
          uv publish dist/*.whl dist/*.tar.gz

  crates:
    if: inputs.registry == 'crates' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: beton-checks-packages
          path: dist/
      - name: Authenticate with crates.io trusted publishing
        if: env.CARGO_REGISTRY_TOKEN == ''
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish verified Cargo source
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.crates-auth.outputs.token }}
        run: |
          python3 -c 'import glob, tarfile; tarfile.open(glob.glob("dist/*.crate")[0]).extractall("dist", filter="data")'
          cargo publish --manifest-path dist/beton-checks-0.3.0/Cargo.toml --locked
