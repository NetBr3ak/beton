[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[project]
name = "beton-checks"
version = "0.3.0"
description = "List Python tests affected by local static imports"
readme = "packaging/README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Szymon Jędryczko" }]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Software Development :: Testing", "Environment :: Console"]
dependencies = []

[project.urls]
Homepage = "https://github.com/NetBr3ak/beton"
Repository = "https://github.com/NetBr3ak/beton"
Issues = "https://github.com/NetBr3ak/beton/issues"

[project.scripts]
beton = "beton_checks.__main__:main"
